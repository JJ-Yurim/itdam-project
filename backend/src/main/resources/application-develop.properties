# `infra/.env` supports host execution; Compose injects the same variables into the container.
spring.config.import=optional:file:../infra/.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mvp_backend}
spring.datasource.username=${POSTGRES_USER:mvp_backend}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:mvp_backend}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
service.zone-id=Asia/Seoul
evaluation.stale-after-seconds=900
# 문장 평가 비동기 전환(ISSUE-208). ai-service의 EVALUATION_MQ_ENABLED=true와 짝이다.
# 문제 시 EVALUATION_DISPATCH=sync 주입으로 동기 경로 롤백할 수 있다(book과 같은 패턴).
evaluation.dispatch=${EVALUATION_DISPATCH:rabbit}
server.servlet.session.cookie.secure=true

email.verification.store=redis
email.verification.mail=smtp

# 보스 HP SSE 팬아웃. 배포 환경은 다중 인스턴스·스케줄 작업을 대비해 Redis pub/sub을 쓴다.
boss.stream.channel=redis
boss.leaderboard.store=redis

# 소셜 로그인: 배포 환경은 자격증명·리다이렉트 베이스 미주입 시 기동에 실패해야 한다(조용한 오배포 방지).
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.redirect-uri=${OAUTH2_REDIRECT_BASE}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.naver.redirect-uri=${OAUTH2_REDIRECT_BASE}/login/oauth2/code/naver
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_BASE}/login/oauth2/code/google

ai.evaluation.client=${AI_EVALUATION_CLIENT:http}
ai.evaluation.base-url=${AI_EVALUATION_BASE_URL:http://ai-service:8001}
ai.evaluation.contract-version=${AI_EVALUATION_CONTRACT_VERSION:sentence-evaluation-v1}

springdoc.swagger-ui.config-url=/api/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.oauth2-redirect-url=/api/swagger-ui/oauth2-redirect.html
server.forward-headers-strategy=framework
similarity.client=${SIMILARITY_CLIENT:pgvector}
similarity.block-threshold=${SIMILARITY_BLOCK_THRESHOLD:0.70}
book.generation.client=${BOOK_GENERATION_CLIENT:rabbit}
app.boss-images.storage-root=${BOSS_IMAGE_STORAGE_ROOT:/app/data/images}

logging.structured.format.console=logstash
logging.structured.json.add.service=backend
logging.structured.json.add.environment=${DEPLOY_BRANCH:unknown}
logging.structured.json.add.commit=${DEPLOY_COMMIT:unknown}
spring.output.ansi.enabled=never
app.scheduler-lock.environment=c206:${DEPLOY_BRANCH:develop}
