# `infra/.env` is optional convenience for `cd backend; .\\gradlew.bat bootRun`.
# Environment variables still take precedence and are required outside local development.
spring.config.import=optional:file:../infra/.env[.properties]
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:mvp_backend}
spring.datasource.username=${POSTGRES_USER:mvp_backend}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
service.zone-id=Asia/Seoul
evaluation.stale-after-seconds=900
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.cors.allowed-origins=http://localhost:5173
security.csrf.cookie-secure=false
ai.evaluation.client=${AI_EVALUATION_CLIENT:http}
ai.evaluation.base-url=${AI_EVALUATION_BASE_URL:http://localhost:8001}
ai.evaluation.contract-version=${AI_EVALUATION_CONTRACT_VERSION:sentence-evaluation-v1}
similarity.client=${SIMILARITY_CLIENT:pgvector}
similarity.block-threshold=${SIMILARITY_BLOCK_THRESHOLD:0.70}
book.generation.client=${BOOK_GENERATION_CLIENT:logging}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:mvp_backend}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
app.boss-images.storage-root=${BOSS_IMAGE_STORAGE_ROOT:./build/local-images}
