spring.application.name=backend

# Redis HTTP sessions are enabled explicitly only for deployed profiles.
spring.autoconfigure.exclude=org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

service.zone-id=Asia/Seoul
evaluation.stale-after-seconds=900
# 중단된 평가 회수 주기와 한 회차 처리량. 운영에서 조정할 수 있도록 기본값을 명시한다.
evaluation.recovery-delay-ms=60000
evaluation.recovery-batch-size=100
# 평가 전달 방식(ISSUE-208). 기본 sync는 기존 동기 호출 그대로이고, rabbit으로 명시
# 전환해야 접수-발행-폴링 비동기 경로(발행 릴레이·결과 리스너 포함)가 켜진다.
evaluation.dispatch=sync
# 미발행 평가 재발행 릴레이 주기와 한 회차 처리량. rabbit 모드에서만 쓰인다.
evaluation.dispatch-delay-ms=2000
evaluation.dispatch-batch-size=100
# 접수 후 이 유예가 지난 미발행 행만 릴레이가 잡는다. confirm 대기(5초)보다 길어야
# 아직 발행 중인 행을 릴레이가 이중 발행하지 않는다.
evaluation.dispatch-grace-seconds=10

# 사용자·회차·서비스일 기준 보스 제출 한도. 운영값은 3이며 배포 프로필은 재정의하지 않는다.
# 부하 테스트(loadtest 프로필)만 이 값을 올려 동시 제출을 만든다.
boss.submission.daily-limit=3

# 주간 선정 문장 피드에 담을 문장 수. 세트 발급(주 시작 후 첫 조회) 시점에만 읽히므로
# 주중에 바꿔도 이미 발급된 세트는 유지되고 다음 주부터 적용된다.
app.sentence-feed.weekly-count=20

# 책 생성 경계(ISSUE-95). 기본은 logging(브로커 미접속)이고 rabbit으로 명시 전환해야 발행된다.
book.generation.client=logging
# 결과가 오지 않는 PENDING job을 폴링 조회가 FAILED로 지연 전이시키는 임계 시간.
book.generation.pending-timeout-seconds=1800
# 결과 리스너 재시도. 소진되면 reject되어 DLX를 따라 result DLQ로 빠진다.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=false

app.cors.allowed-origins=
security.csrf.cookie-secure=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# SMTP 접속 실패가 컨테이너 헬스체크(배포 롤백 판정)를 물고 넘어지지 않도록 mail 인디케이터는 끈다.
management.health.mail.enabled=false

# --- 소셜 로그인 ---
# 실키는 배포 env(KAKAO_CLIENT_ID 등)로 주입한다. 더미 기본값은 로컬·테스트 기동용이며 실제 로그인 시도 시에만 실패한다.
# redirect-uri는 프록시(/api 프리픽스) 뒤에서 {baseUrl} 추론이 어긋나므로 명시한다.
# 콜백 매핑이 /api/login/oauth2/code/* 이므로 로컬 기본 베이스에도 /api를 포함한다.
# 배포 env: OAUTH2_REDIRECT_BASE=https://app.example.com/api
app.oauth2.success-redirect=/
app.oauth2.failure-redirect=/login

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${OAUTH2_REDIRECT_BASE:http://localhost:8080/api}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=account_email,profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=${OAUTH2_REDIRECT_BASE:http://localhost:8080/api}/login/oauth2/code/naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# 구글은 provider 메타데이터가 내장(CommonOAuth2Provider)이라 registration만 정의한다.
# scope에 openid를 넣지 않아 OIDC 경로 대신 커스텀 OAuth2UserService를 태운다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_BASE:http://localhost:8080/api}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile

# SMTP 접속 공통값. 실제 발송은 email.verification.mail=smtp인 프로필(develop/prod)에서만 일어난다.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
admin.account.email=${ADMIN_ACCOUNT_EMAIL:}
admin.account.password=${ADMIN_ACCOUNT_PASSWORD:}

# ai-service 재료 조회용 SELECT 전용 계정(V7). 비어 있으면 마이그레이션이 계정 생성을 건너뛴다.
spring.flyway.placeholders.ai_readonly_password=${AI_READONLY_DB_PASSWORD:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.boss-images.storage-root=/app/data/images
app.boss-images.public-prefix=/images
app.boss-images.placeholder-url=/images/system/boss-phase-placeholder.svg
app.boss-images.max-bytes=5242880
app.boss-images.max-pixels=16777216
app.boss-images.temporary-retention=PT24H
app.boss-images.unreferenced-active-retention=P30D
app.boss-images.cleanup-cron=0 20 4 * * *
