# 보스 제출 동시성 측정 전용 오버레이 프로필(ISSUE-198).
#
#   cd backend; ./gradlew bootRun --args='--spring.profiles.active=local,loadtest'
#
# 데이터소스·Flyway·이미지 경로 등 로컬 기동에 필요한 설정은 local 프로필이 그대로 담당하고,
# 이 파일은 측정을 왜곡하는 값만 덮어쓴다. 배포 프로필(develop·prod)은 이 파일을 읽지 않으므로
# 운영 제출 한도는 application.properties의 3으로 유지된다.

# 사용자당 하루 3회 제한이 걸려 있으면 4번째 요청부터 RATE_LIMITED로 끝나 동시 제출 부하 자체가
# 만들어지지 않는다. 측정 대상은 락 경합이지 한도 검사가 아니므로 사실상 무제한으로 올린다.
boss.submission.daily-limit=1000000

# 임계구역 안에서 실행되는 pgvector 유사도 쿼리가 측정 대상의 핵심이다. Fake로 대체하면
# 개선 전 락 보유 시간이 실제보다 짧게 나와 기준선이 무의미해진다.
similarity.client=pgvector

# 제출 경로는 AI 평가를 호출하지 않지만, 클라이언트 빈이 없으면 기동에 실패한다.
# 외부 서비스 없이 측정할 수 있도록 Fake로 고정한다.
ai.evaluation.client=fake
book.generation.client=logging

# 요청당 로그 I/O가 응답 시간에 섞이지 않도록 낮춘다.
logging.level.root=WARN
logging.level.com.ssafy.c206.backend=WARN

# 풀이 동시 사용자 수보다 작으면 락 대기 대신 커넥션 풀 대기를 측정하게 된다.
# Postgres 기본 max_connections(100)를 넘지 않는 선에서 넉넉히 잡는다.
spring.datasource.hikari.maximum-pool-size=${LOADTEST_DB_POOL_SIZE:50}
server.tomcat.threads.max=${LOADTEST_TOMCAT_THREADS:200}
