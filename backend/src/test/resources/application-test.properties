# 컨텍스트마다 DB를 분리한다. 하나의 mem DB를 공유하면 @DirtiesContext 클래스가 컨텍스트를 닫을 때
# create-drop이 스키마를 지워, 캐시돼 있던 다른 컨텍스트가 빈 DB를 만나는 순서 의존 플레이크가 생긴다.
spring.datasource.url=jdbc:h2:mem:backend-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.cors.allowed-origins=http://localhost:5173
book.generation.client=fake
app.boss-images.storage-root=${user.dir}/build/test-images/${random.uuid}
