server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    # nginx:1.27-alpine의 mime.types는 .js를 application/javascript로 매핑하지만,
    # 베이스 이미지가 바뀌어도 번들 압축이 조용히 꺼지지 않도록 둘 다 넣는다.
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # 컨테이너 HEALTHCHECK 및 호스트 nginx 확인용. 정적 파일과 무관하게 항상 응답한다.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite가 파일명에 콘텐츠 해시를 넣으므로 자산은 영구 캐시한다.
    # 정규식 location이 prefix location보다 우선하므로, 아래 확장자 규칙에
    # 이 블록의 캐시 헤더가 덮이지 않도록 `^~`로 우선순위를 고정한다.
    location ^~ /assets/ {
        try_files $uri =404;
        # `expires`는 별도의 Cache-Control 헤더를 추가해 중복되므로 쓰지 않는다.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 해시가 없는 파일은 배포 직후 바로 갱신되어야 하므로 매번 재검증한다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 확장자가 명확한 요청까지 index.html로 폴백하면 자산 누락이 200으로
    # 가려지고, 브라우저가 HTML을 JS·이미지로 파싱하며 엉뚱한 오류를 낸다.
    location ~* \.(?:js|mjs|css|map|json|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    # createBrowserRouter를 쓰므로 클라이언트 라우트는 index.html로 폴백한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
