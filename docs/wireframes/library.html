<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 도서관</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame">
  <div class="screen-label">LIBRARY (도서관)</div>
  <div class="status-bar"><span>12:30</span><span class="icons">📶 📡 🔋</span></div>
  <div class="url-bar">fantasy-write.net/library</div>
  <div class="page-title dark">도서관</div>
  <div class="content">
    <div class="tabs">
      <div class="tab active">개인 책</div>
      <div class="tab">공동 책</div>
      <div class="tab">미완성 책</div>
      <div class="tab">베스트 문장</div>
    </div>
    <div class="search-bar">🔍 책 제목을 입력하세요</div>
    <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:12px;">✨ 개인 책</div>
    <div class="book-grid">
      <div class="book-card"><div class="cover">🌌</div><div class="book-title">어둠을 헤매는 별바루 빵집</div></div>
      <div class="book-card"><div class="cover">🗝️</div><div class="book-title">비밀정원과 잃어버린 열쇠</div></div>
      <div class="book-card"><div class="cover">🌙</div><div class="book-title">고요한 밤하늘의 파편</div></div>
      <div class="book-card"><div class="cover">🐱</div><div class="book-title">고양이 신관 비비의 외출</div></div>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item"><span class="icon">📝</span>작업실</div>
    <div class="nav-item"><span class="icon">⚔️</span>레이드</div>
    <div class="nav-item"><span class="icon">🏠</span>홈</div>
    <div class="nav-item active"><span class="icon">📚</span>도서관</div>
    <div class="nav-item"><span class="icon">🏆</span>명예의 전당</div>
  </div>
</div>
</body>
</html>
