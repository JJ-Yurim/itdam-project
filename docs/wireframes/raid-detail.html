<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 레이드 상세</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame white-bg">
  <div class="screen-label">RAID DETAIL (레이드 상세)</div>
  <div class="status-bar"><span>9:41</span><span class="icons">📶 📡 🔋</span></div>
  <div class="nav-header"><span class="back-btn">←</span></div>
  <div style="padding:0 20px;"><div style="font-size:32px;font-weight:700;color:var(--text);">진행 중 레이드</div></div>
  <div class="raid-detail-hero">
    <div class="monster-large"></div>
    <div class="raid-detail-name">달빛 정령 루나</div>
    <div class="raid-detail-desc">모든 작가가 함께 문장을 작성하여 보스를 물리치는 공동 창작 레이드입니다.</div>
  </div>
  <div class="content">
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">주제</div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <span class="tag">판타지</span><span class="tag">모험</span><span class="tag">힐링</span><span class="tag">우정</span>
    </div>
    <div class="raid-info-grid" style="padding:0;margin-bottom:24px;">
      <div class="raid-info-item"><div class="info-label">🎯 난이도</div><div class="info-value">Normal</div></div>
      <div class="raid-info-item"><div class="info-label">🏆 참여 인원</div><div class="info-value">14 / 20</div></div>
      <div class="raid-info-item"><div class="info-label">⏰ 남은 시간</div><div class="info-value">1 d 23 hrs</div></div>
    </div>
    <button class="btn-primary" style="margin-bottom:0;">참가하기</button>
  </div>
</div>
</body>
</html>
