<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 도서 상세</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame">
  <div class="screen-label">BOOK DETAIL (도서 상세)</div>
  <div class="status-bar"><span>12:30</span><span class="icons">📶 📡 🔋</span></div>
  <div class="url-bar">fantasy-write.net/library/book</div>
  <div class="nav-header"><span class="back-btn">←</span><span class="title">도서 상세 정보</span></div>
  <div class="content">
    <div class="detail-tabs mb-16">
      <div class="detail-tab active">개인 책</div>
      <div class="detail-tab">완결작</div>
    </div>
    <div class="book-cover-large">🌙</div>
    <div class="book-detail-title">지붕 위의 은하수 보관소</div>
    <div class="book-detail-author">모카</div>
    <div class="tags">
      <span class="tag">#신비로움</span>
      <span class="tag">#따뜻함</span>
      <span class="tag">#꿈꾸는듯한</span>
      <span class="tag">#고요한</span>
    </div>
    <div class="section-title">작품 소개</div>
    <div class="book-description">밤이 깊어질 때면 지붕 위의 은하수들을 모아 유리병 속에 고이 보관하는 비밀스러운 상인들의 이야기. 달빛이 흘러넘치는 포근하고 몽환적인 감성 단편 소설집입니다.</div>
    <div class="book-stats">
      <span class="book-stat">❤️ 좋아요 128</span>
      <span class="book-stat">🔖 북마크 43</span>
    </div>
    <button class="btn-primary">📖 작품 읽기 시작</button>
  </div>
  <div class="bottom-nav">
    <div class="nav-item"><span class="icon">📝</span>작업실</div>
    <div class="nav-item"><span class="icon">⚔️</span>레이드</div>
    <div class="nav-item"><span class="icon">🏠</span>홈</div>
    <div class="nav-item active"><span class="icon">📚</span>도서관</div>
    <div class="nav-item"><span class="icon">🏆</span>명예의 전당</div>
  </div>
</div>
</body>
</html>
