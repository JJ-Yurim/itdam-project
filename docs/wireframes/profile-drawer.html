<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 프로필 드로어</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame white-bg" style="display:flex;height:844px;">
  <div class="screen-label" style="position:absolute;top:0;left:0;right:0;z-index:10;">PROFILE DRAWER</div>
  <div style="background:rgba(0,0,0,0.3);width:40%;"></div>
  <div class="drawer" style="flex:1;">
    <div class="drawer-close">✕</div>
    <div style="padding-top:20px;">
      <div class="drawer-profile">
        <div class="drawer-avatar"></div>
        <div>
          <div class="drawer-name">모카 작가님 🌟</div>
          <div class="drawer-level">Lv.12 견습 아키텍스트 마법사</div>
        </div>
      </div>
      <div class="drawer-menu">
        <div class="drawer-menu-item"><span class="d-icon">📦</span> 내 서고</div>
        <div class="drawer-menu-item"><span class="d-icon">👤</span> 마이 페이지</div>
        <div class="drawer-menu-item"><span class="d-icon">🚪</span> 로그아웃</div>
      </div>
    </div>
    <div style="position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-muted);">Story Sparkle v0.4.0 · beta</div>
  </div>
</div>
</body>
</html>
