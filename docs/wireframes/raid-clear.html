<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 레이드 클리어</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame white-bg">
  <div class="screen-label">RAID CLEAR (집필 완료)</div>
  <div class="status-bar"><span>9:41</span><span class="icons">📶 📡 🔋</span></div>
  <div class="clear-section">
    <div class="trophy">🏆</div>
    <div class="clear-title">집필 완료</div>
    <div class="clear-book">해리포터 마법사의 돌</div>
    <div class="mvp-section">
      <div class="mvp-title">오늘의 MVP 문장</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#c4b5fd,#fbbf24);"></div>
        <span style="font-size:13px;font-weight:600;">갤러리_드림스</span>
        <span class="mvp-badge">MVP</span>
      </div>
      <div class="mvp-quote">"바람이 그녀의 옛 약속을 잊은 숲으로 다시 가져갔고, 별들의 꿈을 깨웠다."</div>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:16px;">나의 기여도</div>
    <div class="contribution-stats">
      <div class="contrib-item"><div class="c-icon">📝</div><div class="c-label">제출 횟수</div></div>
      <div class="contrib-item"><div class="c-icon">⚔️</div><div class="c-label">데미지</div></div>
      <div class="contrib-item"><div class="c-icon">🏅</div><div class="c-label">순위</div></div>
    </div>
    <button class="btn-primary">📚 도서관으로 보러가기</button>
    <button class="btn-secondary">레이드로 돌아가기</button>
  </div>
</div>
</body>
</html>
