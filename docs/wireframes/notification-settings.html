<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 알림 설정</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame white-bg">
  <div class="screen-label">NOTIFICATION SETTINGS</div>
  <div class="status-bar"><span>12:30</span><span class="icons">📶 📡 🔋</span></div>
  <div class="url-bar">fantasy-write.net/settings/notification</div>
  <div class="nav-header"><span class="back-btn">←</span><span class="title" style="font-size:20px;">알림 설정</span></div>
  <div class="settings-item"><span class="setting-label">AI 문장 평가 완료 알림</span><div class="toggle"></div></div>
  <div class="settings-item"><span class="setting-label">레이드 종료 알림</span><div class="toggle"></div></div>
  <div class="settings-item"><span class="setting-label">내 문장 공동 책 수록 알림</span><div class="toggle"></div></div>
  <div class="settings-item"><span class="setting-label">개인 책 공개 심사 결과 알림</span><div class="toggle"></div></div>
  <div class="settings-item"><span class="setting-label">베스트 문장 선정 알림</span><div class="toggle off"></div></div>
  <div class="settings-item"><span class="setting-label">댓글 및 반응 알림</span><div class="toggle"></div></div>
</div>
</body>
</html>
