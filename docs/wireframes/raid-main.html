<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 레이드 메인</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame white-bg">
  <div class="screen-label">RAID MAIN (레이드)</div>
  <div class="status-bar"><span>9:41</span><span class="icons">📶 📡 🔋</span></div>
  <div style="padding:20px;">
    <div style="font-size:32px;font-weight:700;color:var(--text);">레이드</div>
    <div style="font-size:14px;color:var(--text-secondary);margin-bottom:20px;">함께 쓰는 스토리 레이드</div>
    <div class="tabs" style="margin-bottom:20px;">
      <div class="tab active">진행 중</div>
      <div class="tab">종료</div>
      <div class="tab">클리어</div>
    </div>
    <div class="raid-grid">
      <div class="raid-tile">
        <div class="raid-difficulty easy">쉬움</div>
        <div class="raid-participants">🏆 참여 인원 8/10</div>
        <div class="raid-monster"></div>
        <div class="raid-name">달빛 정령 루나</div>
        <div class="raid-genre">판타지</div>
        <div class="progress-label">진행률 65%</div>
        <div class="hp-bar" style="margin-top:4px;"><div class="fill" style="width:65%;"></div></div>
      </div>
      <div class="raid-tile">
        <div class="raid-difficulty normal">보통</div>
        <div class="raid-participants">🏆 참여 인원 14/20</div>
        <div class="raid-monster" style="background:linear-gradient(135deg,#93c5fd,#c4b5fd);"></div>
        <div class="raid-name">솜구름 정령</div>
        <div class="raid-genre">우정</div>
        <div class="progress-label">진행률 40%</div>
        <div class="hp-bar" style="margin-top:4px;"><div class="fill" style="width:40%;"></div></div>
      </div>
      <div class="raid-tile">
        <div class="raid-difficulty normal">보통</div>
        <div class="raid-participants">🏆 참여 인원 19/20</div>
        <div class="raid-monster" style="background:linear-gradient(135deg,#6ee7b7,#a78bfa);"></div>
        <div class="raid-name">작은 용</div>
        <div class="raid-genre">모험</div>
        <div class="progress-label">진행률 85%</div>
        <div class="hp-bar" style="margin-top:4px;"><div class="fill" style="width:85%;"></div></div>
      </div>
      <div class="raid-tile">
        <div class="raid-difficulty hard">어려움</div>
        <div class="raid-participants">🏆 참여 인원 3/5</div>
        <div class="raid-monster" style="background:linear-gradient(135deg,#fda4af,#fbbf24);"></div>
        <div class="raid-name">버섯 요정</div>
        <div class="raid-genre">치유</div>
        <div class="progress-label">진행률 12%</div>
        <div class="hp-bar" style="margin-top:4px;"><div class="fill" style="width:12%;"></div></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="nav-item"><span class="icon">📝</span>작업실</div>
    <div class="nav-item active"><span class="icon">⚔️</span>레이드</div>
    <div class="nav-item"><span class="icon">🏠</span>홈</div>
    <div class="nav-item"><span class="icon">📚</span>도서관</div>
    <div class="nav-item"><span class="icon">🏆</span>명예의 전당</div>
  </div>
</div>
</body>
</html>
