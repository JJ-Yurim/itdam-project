<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 레이드 전투</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame white-bg">
  <div class="screen-label">RAID BATTLE (레이드 진행)</div>
  <div class="status-bar"><span>9:41</span><span class="icons">📶 📡 🔋</span></div>
  <div class="nav-header"><span class="back-btn">←</span></div>
  <div style="padding:0 20px 8px;">
    <div style="font-size:24px;font-weight:700;">레이드 진행</div>
    <div style="font-size:13px;color:var(--text-muted);">달빛 정령 루나</div>
  </div>
  <div class="hp-section">
    <div class="hp-header"><span class="hp-label-text">보스 HP</span><span class="hp-percentage">HP 32%</span></div>
    <div class="hp-bar"><div class="fill" style="width:32%;"></div></div>
  </div>
  <div style="text-align:center;margin-bottom:16px;">
    <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#c4b5fd,#93c5fd);margin:0 auto;"></div>
  </div>
  <div class="content">
    <div style="font-size:14px;font-weight:600;margin-bottom:8px;">오늘의 단어</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <span class="tag">달빛</span><span class="tag">꽃 숲</span><span class="tag">비밀</span><span class="tag">약속</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span style="font-size:14px;font-weight:600;">나의 선택한 문장</span>
      <button style="padding:6px 16px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:13px;">제출</button>
    </div>
    <div class="sentence-item">
      <div class="sentence-meta"><span style="font-size:10px;padding:2px 8px;background:#e6f7f3;color:#0d9488;border-radius:6px;">해시</span><span class="sentence-time">2024.03.15</span></div>
      <div class="sentence-text">별무리가 속삭이는 푸른 밤, 우리는 단 하나의 기억을 좇아 하늘에 발자취를 남겼다.</div>
    </div>
    <div class="sentence-item">
      <div class="sentence-meta"><span class="sentence-time">2024.03.14</span></div>
      <div class="sentence-text">부지런 나의 적은 공방에서 시작된 우리의 조그마한 이야기 조각들</div>
    </div>
    <div class="sentence-item">
      <div class="sentence-meta"><span class="sentence-time">2024.02.10</span></div>
      <div class="sentence-text">속삭임조차 고요로 가리었는 호수가 나는 대칭의 가벼운 순결로나 큰 빛을 뿜는다.</div>
    </div>
  </div>
</div>
</body>
</html>
