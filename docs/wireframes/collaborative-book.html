<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잇담 와이어프레임 · 공동 도서</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
<div class="phone-frame">
  <div class="screen-label">COLLABORATIVE BOOK (공동 도서)</div>
  <div class="status-bar"><span>12:30</span><span class="icons">📶 📡 🔋</span></div>
  <div class="url-bar">fantasy-write.net/library/book</div>
  <div class="nav-header"><span class="back-btn">←</span><span class="title">공동 도서 정보</span></div>
  <div class="content">
    <div class="detail-tabs mb-16">
      <div class="detail-tab active">공동 책</div>
      <div class="detail-tab">최종 클리어</div>
    </div>
    <div class="book-cover-large" style="background:linear-gradient(180deg,#1a2a4a,#2d4a6e,#44607e);">🏰</div>
    <div class="book-detail-title">비밀정원과 잃어버린 열쇠</div>
    <div class="collab-stats">
      <div class="collab-stat"><div class="cs-label">참여 작가</div><div class="cs-value">24명</div></div>
      <div class="collab-stat"><div class="cs-label">전체 문장</div><div class="cs-value">184개</div></div>
      <div class="collab-stat"><div class="cs-label">총 공격력</div><div class="cs-value">3.4k HP</div></div>
    </div>
    <div class="section-title">작품 소개</div>
    <div class="book-description">밤이 깊어질 때면 지붕 위의 은하수들을 모아 유리병 속에 고이 보관하는 비밀스러운 상인들의 이야기. 달빛이 흘러넘치는 포근하고 몽환적인 감성 단편 소설집입니다.</div>
    <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:8px;">기여한 모험가들</div>
    <div style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">모카 외 23명의 작가가 참여 중입니다.</div>
    <button class="btn-primary">📖 공동 소설집 전체 읽기</button>
  </div>
</div>
</body>
</html>
