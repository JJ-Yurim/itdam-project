# 보스 제출 측정 전용 PostgreSQL (ISSUE-198).
#
# infra/compose.yml의 개발용 postgres를 그대로 쓰지 않는 이유:
#   - 측정은 수만 건의 시드 행을 넣고 지운다. 개발 중인 로컬 데이터와 섞이면 안 된다.
#   - 시드·정리를 반복하면 테이블이 부풀어 실행마다 조건이 달라진다. 버리고 다시 만드는 편이 낫다.
#   - 개발용 컨테이너를 멈추지 않고 병행 실행할 수 있어야 한다. 그래서 포트를 분리한다.
#
# 유사도 검사가 측정 대상이므로 pgvector 확장이 있는 이미지를 쓴다. 공식 postgres 이미지에는 없다.
#
#   docker compose -f scripts/loadtest/compose.yml up -d
#   docker compose -f scripts/loadtest/compose.yml down -v   # 측정이 끝나면 데이터까지 버린다

name: c206-loadtest

services:
  postgres-loadtest:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${LOADTEST_POSTGRES_DB:-loadtest}
      POSTGRES_USER: ${LOADTEST_POSTGRES_USER:-loadtest}
      POSTGRES_PASSWORD: ${LOADTEST_POSTGRES_PASSWORD:-loadtest}
    ports:
      - "127.0.0.1:${LOADTEST_POSTGRES_PORT:-55432}:5432"
    # 측정 데이터는 재현 가능한 시드라 영속화하지 않는다. 컨테이너를 내리면 함께 사라진다.
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      # run.sh가 개발용 postgres와 구분해 찾는 표식이다.
      c206.service: postgres-loadtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
